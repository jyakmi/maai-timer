<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>間合い</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#93704b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="間合い">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f5f1e9;
    --surface: #fbf9f4;
    --surface-border: #e2dac8;
    --text: #2b2924;
    --text-muted: #8a8271;
    --wood: #93704b;
    --wood-soft: #ece1d0;
    --sage: #74886d;
    --sage-soft: #e2e8dd;
    --knob-ring: #fffdf9;
    --shadow: 0 1px 2px rgba(43, 41, 36, 0.05), 0 16px 40px rgba(43, 41, 36, 0.08);
    --knob-shadow: 0 2px 6px rgba(43, 41, 36, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a16;
      --surface: #242119;
      --surface-border: #38332a;
      --text: #ede8dd;
      --text-muted: #a89e8a;
      --wood: #c99f74;
      --wood-soft: #382d20;
      --sage: #9ab093;
      --sage-soft: #26302a;
      --knob-ring: #2b2721;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 20px 44px rgba(0, 0, 0, 0.4);
      --knob-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1c1a16;
    --surface: #242119;
    --surface-border: #38332a;
    --text: #ede8dd;
    --text-muted: #a89e8a;
    --wood: #c99f74;
    --wood-soft: #382d20;
    --sage: #9ab093;
    --sage-soft: #26302a;
    --knob-ring: #2b2721;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 20px 44px rgba(0, 0, 0, 0.4);
    --knob-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  button {
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .time-display, .counter-value {
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  :root { --ring-size: 236px; }

  @media (max-width: 480px) {
    :root { --ring-size: min(70vw, 300px); }
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 34px 28px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    transition: border-color 0.4s ease;
  }

  .card[data-mode="focus"] { border-color: color-mix(in srgb, var(--wood) 35%, var(--surface-border)); }
  .card[data-mode="rest"]  { border-color: color-mix(in srgb, var(--sage) 35%, var(--surface-border)); }

  .tab-bar {
    display: flex;
    gap: 6px;
    background: var(--bg);
    border-radius: 999px;
    padding: 4px;
    border: 1px solid var(--surface-border);
  }

  .tab-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab-btn svg { width: 16px; height: 16px; }

  .tab-btn[data-active="true"] {
    background: var(--surface);
    color: var(--wood);
    box-shadow: 0 1px 3px rgba(43, 41, 36, 0.12);
  }

  .tab-btn:focus-visible { outline: 2px solid var(--wood); outline-offset: 2px; }

  .top-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--surface-border);
    background: var(--bg);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, color 0.15s ease, transform 0.08s ease;
  }

  .icon-btn:active { transform: scale(0.92); }
  .icon-btn:hover { color: var(--text); background: var(--wood-soft); }
  .icon-btn:focus-visible { outline: 2px solid var(--wood); outline-offset: 2px; }
  .icon-btn svg { width: 16px; height: 16px; }

  .mode-dot[hidden] { visibility: hidden; }

  .mode-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--wood);
    transition: background 0.4s ease;
  }

  .card[data-mode="rest"] .mode-dot { background: var(--sage); }

  .ring-wrap {
    position: relative;
    width: var(--ring-size);
    height: var(--ring-size);
    touch-action: none;
    cursor: pointer;
  }

  .ring-dial-svg { transform: rotate(-90deg); display: block; width: 100%; height: 100%; }

  .ring-track { fill: none; stroke: var(--surface-border); stroke-width: 10; }

  .ring-progress {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke 0.4s ease;
  }

  .ring-progress.animated { transition: stroke-dashoffset 0.3s linear, stroke 0.4s ease; }

  .ring-knob {
    fill: var(--knob-ring);
    stroke: var(--wood);
    stroke-width: 3;
    filter: drop-shadow(var(--knob-shadow));
  }

  .card[data-mode="rest"] .ring-knob { stroke: var(--sage); }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    pointer-events: none;
  }

  .time-display {
    font-size: 52px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    line-height: 1;
  }

  .transport-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--wood);
  }

  .transport-icon svg { width: 100%; height: 100%; }

  .card[data-mode="rest"] .transport-icon { color: var(--sage); }

  #timerView, #counterView {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    width: 100%;
  }

  #timerView[hidden], #counterView[hidden] {
    display: none;
  }

  .counter-circle {
    width: var(--ring-size);
    height: var(--ring-size);
    border-radius: 50%;
    border: 1px solid var(--surface-border);
    background: var(--bg);
    box-shadow: inset 0 0 0 10px var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: transform 0.08s ease, background 0.15s ease;
    font-family: inherit;
    touch-action: manipulation;
  }

  .counter-circle:active { transform: scale(0.98); }
  .counter-circle:hover { background: var(--wood-soft); }
  .counter-circle:focus-visible { outline: 2px solid var(--wood); outline-offset: 4px; }

  .counter-value {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--wood);
  }

  .counter-stage {
    position: relative;
  }

  .sparkle-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
  }

  .sparkle-particle {
    position: absolute;
    font-size: 22px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    animation: sparkle-float 0.8s ease-out forwards;
  }

  @keyframes sparkle-float {
    0% { opacity: 0; transform: translate(-50%, -50%) translate(var(--sx0, 0px), var(--sy0, 0px)) scale(0.6) rotate(0deg); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--sx1, 0px), var(--sy1, -70px)) scale(1.1) rotate(var(--srot, 20deg)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sparkle-particle { animation: none; opacity: 0; }
  }

  .counter-controls {
    display: flex;
    justify-content: center;
  }

  .counter-minus {
    width: 44px;
    height: 44px;
    font-size: 22px;
  }

  .break-hint {
    min-height: 28px;
    font-size: 13px;
    color: var(--sage);
    background: var(--sage-soft);
    padding: 6px 16px;
    border-radius: 999px;
    text-align: center;
  }

  .break-hint[hidden] { visibility: hidden; }

  .settings {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 18px;
    border-top: 1px dashed var(--surface-border);
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.25s ease, padding 0.3s ease, border-color 0.3s ease;
  }

  .settings[data-open="true"] {
    max-height: 320px;
    opacity: 1;
  }

  .settings[data-open="false"] {
    padding-top: 0;
    border-color: transparent;
  }

  .field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .field-label {
    font-size: 13px;
    color: var(--text-muted);
  }

  .presets-row { flex-direction: column; align-items: flex-start; gap: 10px; }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }

  button.chip {
    font-family: inherit;
    cursor: pointer;
    border-radius: 999px;
    border: 1px solid var(--surface-border);
    background: transparent;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 14px;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  button.chip:hover { background: var(--wood-soft); }

  button.chip[data-active="true"] {
    background: var(--wood-soft);
    border-color: var(--wood);
    color: var(--wood);
  }

  .stepper { display: flex; align-items: center; gap: 10px; }

  .stepper button {
    width: 26px;
    height: 26px;
    padding: 0;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1;
    border: 1px solid var(--surface-border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stepper button:hover { background: var(--wood-soft); }

  .stepper input {
    width: 42px;
    text-align: center;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    padding: 4px;
  }

  select {
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    padding: 6px 8px;
  }

  .sound-row { display: flex; align-items: center; gap: 8px; }

  .daily-stats {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring-progress, .settings { transition: none; }
  }
</style>

<div class="card" id="card" data-mode="focus">
  <div class="tab-bar">
    <button class="tab-btn" id="tabTimer" data-active="true" aria-label="タイマー" title="タイマー">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path><path d="M9 2h6"></path></svg>
    </button>
    <button class="tab-btn" id="tabCounter" data-active="false" aria-label="カウンター" title="カウンター">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
    </button>
  </div>

  <div class="top-row">
    <button class="icon-btn reset-btn" id="resetBtn" aria-label="リセット" title="リセット">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
    </button>
    <span class="mode-dot" id="modeDot"></span>
    <button class="icon-btn settings-btn" id="settingsBtn" aria-label="設定" title="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <div id="timerView">
    <div class="ring-wrap" id="ringWrap">
      <svg class="ring-dial-svg" width="236" height="236" viewBox="0 0 236 236">
        <circle class="ring-track" cx="118" cy="118" r="102"></circle>
        <circle class="ring-progress" id="ringProgress" cx="118" cy="118" r="102"></circle>
        <circle class="ring-knob" id="ringKnob" cx="118" cy="16" r="9"></circle>
      </svg>
      <div class="ring-center">
        <div class="time-display" id="timeDisplay">25</div>
        <div class="transport-icon" id="playIcon"></div>
      </div>
    </div>

    <p class="break-hint" id="breakHint" hidden></p>

    <div class="settings" id="settings" data-open="false">
      <div class="field-row presets-row">
        <span class="field-label">プリセット</span>
        <div class="presets">
          <button class="chip" data-focus="90" data-rest="20">深い集中 90/20</button>
          <button class="chip" data-focus="25" data-rest="5">浅い集中 25/5</button>
          <button class="chip" data-focus="52" data-rest="17">52/17</button>
        </div>
      </div>
      <div class="field-row">
        <span class="field-label">休憩時間（分）</span>
        <div class="stepper">
          <button data-step="-1" data-target="restMin" aria-label="休憩時間を減らす">−</button>
          <input type="number" id="restMin" value="5" min="1" max="60" inputmode="numeric">
          <button data-step="1" data-target="restMin" aria-label="休憩時間を増やす">＋</button>
        </div>
      </div>
      <div class="field-row">
        <span class="field-label">ベル音</span>
        <div class="sound-row">
          <select id="soundSelect">
            <option value="temple">鐘（低く長い余韻）</option>
            <option value="chime" selected>チャイム（澄んだ音）</option>
            <option value="beep">シンプルビープ</option>
            <option value="moktak">木魚（乾いた音）</option>
          </select>
          <button class="chip" id="previewBtn">試聴</button>
        </div>
      </div>
      <p class="daily-stats" id="dailyStats">今日: 0回 ／ 0分</p>
    </div>
  </div>

  <div id="counterView" hidden>
    <div class="counter-stage">
      <button class="counter-circle" id="counterCircle" aria-label="カウントを増やす" title="タップで+1">
        <span class="counter-value" id="counterValue">0</span>
      </button>
      <div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>
    </div>

    <div class="counter-controls">
      <button class="icon-btn counter-minus" id="counterMinus" aria-label="1減らす" title="1減らす">−</button>
    </div>

    <div class="settings" id="counterSettings" data-open="false">
      <div class="field-row">
        <span class="field-label">増減幅</span>
        <div class="stepper">
          <button data-step="-1" data-target="counterStep" aria-label="増減幅を減らす">−</button>
          <input type="number" id="counterStep" value="1" min="1" max="1000" inputmode="numeric">
          <button data-step="1" data-target="counterStep" aria-label="増減幅を増やす">＋</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var R = 102;
  var CIRC = 2 * Math.PI * R;
  var MAX_FOCUS_MIN = 90;

  var card = document.getElementById("card");
  var modeDot = document.getElementById("modeDot");
  var ringWrap = document.getElementById("ringWrap");
  var ringProgress = document.getElementById("ringProgress");
  var ringKnob = document.getElementById("ringKnob");
  var timeDisplay = document.getElementById("timeDisplay");
  var playIcon = document.getElementById("playIcon");
  var resetBtn = document.getElementById("resetBtn");
  var settingsBtn = document.getElementById("settingsBtn");
  var settingsPanel = document.getElementById("settings");
  var restMinInput = document.getElementById("restMin");
  var soundSelect = document.getElementById("soundSelect");
  var previewBtn = document.getElementById("previewBtn");
  var breakHint = document.getElementById("breakHint");
  var presetBtns = document.querySelectorAll(".chip[data-focus]");
  var dailyStatsEl = document.getElementById("dailyStats");
  var tabTimer = document.getElementById("tabTimer");
  var tabCounter = document.getElementById("tabCounter");
  var timerView = document.getElementById("timerView");
  var counterView = document.getElementById("counterView");
  var counterCircle = document.getElementById("counterCircle");
  var counterValue = document.getElementById("counterValue");
  var sparkleLayer = document.getElementById("sparkleLayer");
  var counterMinus = document.getElementById("counterMinus");
  var counterSettings = document.getElementById("counterSettings");
  var counterStepInput = document.getElementById("counterStep");

  ringProgress.style.strokeDasharray = CIRC;

  var BREAK_MESSAGES = [
    "画面から離れて、遠くを見る",
    "立ち上がって、伸びをする",
    "窓の外を見る",
    "水を一口飲む",
    "肩と首をゆっくり回す",
    "深呼吸を3回する"
  ];

  var MODE_COLOR = { focus: "#93704b", rest: "#74886d" };

  var state = {
    mode: "focus",
    running: false,
    focusMin: 25,
    restMin: 5,
    remaining: 25 * 60,
    total: 25 * 60,
    tickId: null,
    endAt: 0,
    hintText: "",
    focusCycles: 0,
    isLongBreak: false,
    started: false
  };

  var activeTab = "timer";

  var counterState = { count: 0, step: 1 };

  function loadCounter() {
    try {
      var saved = JSON.parse(localStorage.getItem("maai-counter") || "null");
      if (saved && typeof saved.count === "number") counterState.count = saved.count;
      if (saved && typeof saved.step === "number") counterState.step = saved.step;
    } catch (e) {}
  }

  function saveCounter() {
    try {
      localStorage.setItem("maai-counter", JSON.stringify(counterState));
    } catch (e) {}
  }

  function clampInt(v, min, max) {
    v = parseInt(v, 10);
    if (isNaN(v)) v = min;
    return Math.max(min, Math.min(max, v));
  }

  function setArc(fraction, animated) {
    fraction = Math.max(0, Math.min(1, fraction));
    ringProgress.classList.toggle("animated", !!animated);
    ringProgress.style.strokeDashoffset = CIRC * (1 - fraction);
    var angle = fraction * 2 * Math.PI;
    var cx = 118 + Math.cos(angle) * R;
    var cy = 118 + Math.sin(angle) * R;
    ringKnob.setAttribute("cx", cx);
    ringKnob.setAttribute("cy", cy);
  }

  function formatClock(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }

  function updatePresetHighlight() {
    presetBtns.forEach(function (btn) {
      var match = parseInt(btn.getAttribute("data-focus"), 10) === state.focusMin &&
        parseInt(btn.getAttribute("data-rest"), 10) === state.restMin;
      btn.setAttribute("data-active", match ? "true" : "false");
    });
  }

  function render() {
    ringProgress.setAttribute("stroke", MODE_COLOR[state.mode]);

    if (state.started) {
      timeDisplay.textContent = formatClock(state.remaining);
      setArc(state.total > 0 ? state.remaining / state.total : 0, state.running);
    } else {
      timeDisplay.textContent = String(state.mode === "focus" ? state.focusMin : state.restMin);
      var frac = state.mode === "focus" ? state.focusMin / MAX_FOCUS_MIN : state.restMin / 60;
      setArc(frac, false);
    }

    playIcon.innerHTML = state.running
      ? '<svg viewBox="0 0 32 32"><rect x="8" y="6" width="6" height="20" rx="2.5" fill="currentColor"/><rect x="18" y="6" width="6" height="20" rx="2.5" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 32 32"><path d="M9 6 L25 16 L9 26 Z" fill="currentColor" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';

    card.setAttribute("data-mode", state.mode);

    if (state.running && state.mode === "rest") {
      breakHint.textContent = state.hintText || "";
      breakHint.hidden = false;
    } else {
      breakHint.hidden = true;
    }
  }

  function tick() {
    var msLeft = state.endAt - Date.now();
    var secLeft = Math.max(0, Math.ceil(msLeft / 1000));
    if (secLeft <= 0) {
      state.remaining = 0;
      render();
      var toFocus = state.mode === "rest";
      playBell(toFocus);
      switchMode();
      if (state.running) state.endAt = Date.now() + state.remaining * 1000;
      return;
    }
    if (secLeft !== state.remaining) {
      state.remaining = secLeft;
      render();
    }
  }

  var LONG_BREAK_EVERY = 4;

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function loadDailyStats() {
    try {
      var saved = JSON.parse(localStorage.getItem("maai-daily-stats") || "null");
      if (saved && saved.date === todayKey()) return saved;
    } catch (e) {}
    return { date: todayKey(), count: 0, minutes: 0 };
  }

  function recordCompletedFocus(minutes) {
    var stats = loadDailyStats();
    stats.count += 1;
    stats.minutes += minutes;
    try { localStorage.setItem("maai-daily-stats", JSON.stringify(stats)); } catch (e) {}
    renderDailyStats(stats);
  }

  function renderDailyStats(stats) {
    stats = stats || loadDailyStats();
    if (dailyStatsEl) {
      dailyStatsEl.textContent = "今日: " + stats.count + "回 ／ " + stats.minutes + "分";
    }
  }

  function switchMode() {
    var completedFocusMinutes = state.mode === "focus" ? state.focusMin : null;
    state.mode = state.mode === "focus" ? "rest" : "focus";

    if (state.mode === "rest") {
      if (completedFocusMinutes !== null) recordCompletedFocus(completedFocusMinutes);
      state.focusCycles += 1;
      state.isLongBreak = state.focusCycles % LONG_BREAK_EVERY === 0;
      var restLen = state.isLongBreak ? Math.min(60, state.restMin * 3) : state.restMin;
      state.total = restLen * 60;
      state.hintText = (state.isLongBreak ? "長めの休憩。" : "") + BREAK_MESSAGES[Math.floor(Math.random() * BREAK_MESSAGES.length)];
    } else {
      state.isLongBreak = false;
      state.total = state.focusMin * 60;
    }
    state.remaining = state.total;
    render();
  }

  function startPause() {
    if (state.running) {
      state.running = false;
      clearInterval(state.tickId);
      render();
      return;
    }
    if (!state.started) {
      var minutes = state.mode === "focus" ? state.focusMin : state.restMin;
      state.total = minutes * 60;
      state.remaining = state.total;
    }
    state.started = true;
    state.running = true;
    state.endAt = Date.now() + state.remaining * 1000;
    state.tickId = setInterval(tick, 250);
    render();
  }

  function reset() {
    state.running = false;
    state.started = false;
    clearInterval(state.tickId);
    state.mode = "focus";
    state.focusCycles = 0;
    state.isLongBreak = false;
    state.total = state.focusMin * 60;
    state.remaining = state.total;
    render();
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && state.running) tick();
  });

  resetBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (activeTab === "counter") {
      if (counterState.count === 0) return;
      if (!confirm("カウンターを0に戻します。よろしいですか？")) return;
      counterState.count = 0;
      saveCounter();
      renderCounter();
    } else {
      if (!state.started) return;
      if (!confirm("タイマーをリセットします。進行中の時間は失われます。よろしいですか？")) return;
      reset();
    }
  });

  settingsBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    var panel = activeTab === "counter" ? counterSettings : settingsPanel;
    var open = panel.getAttribute("data-open") === "true";
    panel.setAttribute("data-open", open ? "false" : "true");
  });

  // --- Tab switching ---
  function setActiveTab(tab) {
    activeTab = tab;
    tabTimer.setAttribute("data-active", tab === "timer" ? "true" : "false");
    tabCounter.setAttribute("data-active", tab === "counter" ? "true" : "false");
    timerView.hidden = tab !== "timer";
    counterView.hidden = tab !== "counter";
    modeDot.hidden = tab !== "timer";
    settingsPanel.setAttribute("data-open", "false");
    counterSettings.setAttribute("data-open", "false");
    if (tab === "counter") renderCounter();
  }

  tabTimer.addEventListener("click", function () { setActiveTab("timer"); });
  tabCounter.addEventListener("click", function () { setActiveTab("counter"); });

  // --- Counter ---
  function renderCounter() {
    counterValue.textContent = String(counterState.count);
  }

  var SPARKLE_ICONS = ["✨", "⭐", "🌸", "🍀", "💫", "🎯", "🔥", "⚡"];

  function spawnSparkle() {
    if (!sparkleLayer) return;
    var el = document.createElement("span");
    el.className = "sparkle-particle";
    el.textContent = SPARKLE_ICONS[Math.floor(Math.random() * SPARKLE_ICONS.length)];
    var angle = Math.random() * Math.PI * 2;
    var dist = 30 + Math.random() * 20;
    el.style.setProperty("--sx0", "0px");
    el.style.setProperty("--sy0", "0px");
    el.style.setProperty("--sx1", (Math.cos(angle) * dist) + "px");
    el.style.setProperty("--sy1", (Math.sin(angle) * dist - 60) + "px");
    el.style.setProperty("--srot", (Math.random() * 40 - 20) + "deg");
    sparkleLayer.appendChild(el);
    setTimeout(function () { el.remove(); }, 850);
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  function counterIncrement() {
    counterState.count += counterState.step;
    saveCounter();
    renderCounter();
    spawnSparkle();
    vibrate(10);
    if (counterState.count !== 0 && counterState.count % 10 === 0) {
      playMilestone();
    } else {
      playClick(true);
    }
  }

  function counterDecrement() {
    counterState.count -= counterState.step;
    saveCounter();
    renderCounter();
    vibrate(10);
    if (counterState.count !== 0 && counterState.count % 10 === 0) {
      playMilestone();
    } else {
      playClick(false);
    }
  }

  counterCircle.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    counterIncrement();
  });
  counterMinus.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    counterDecrement();
  });

  counterStepInput.addEventListener("change", function () {
    counterState.step = clampInt(counterStepInput.value, 1, 1000);
    counterStepInput.value = counterState.step;
    saveCounter();
  });

  document.querySelectorAll('.stepper button[data-target="counterStep"]').forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var step = parseInt(btn.getAttribute("data-step"), 10);
      counterState.step = clampInt(counterState.step + step, 1, 1000);
      counterStepInput.value = counterState.step;
      saveCounter();
    });
  });

  counterStepInput.addEventListener("click", function (e) { e.stopPropagation(); });

  document.addEventListener("keydown", function (e) {
    if (activeTab !== "counter") return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowUp" || e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      counterIncrement();
    } else if (e.key === "ArrowDown" || e.key === "Backspace") {
      e.preventDefault();
      counterDecrement();
    }
  });

  loadCounter();

  // --- Drag-to-set (focus dial), physical-timer style ---
  var dragging = false;
  var draggedThisGesture = false;

  function angleToMinutes(clientX, clientY) {
    var rect = ringWrap.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = clientX - cx;
    var dy = clientY - cy;
    var angle = Math.atan2(dy, dx) + Math.PI / 2;
    if (angle < 0) angle += 2 * Math.PI;
    var fraction = angle / (2 * Math.PI);
    return clampInt(Math.round(fraction * MAX_FOCUS_MIN), 1, MAX_FOCUS_MIN);
  }

  ringWrap.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    draggedThisGesture = false;
    dragging = !state.started;
    ringWrap.setPointerCapture(e.pointerId);
  });

  ringWrap.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    draggedThisGesture = true;
    var minutes = angleToMinutes(e.clientX, e.clientY);
    if (state.mode === "focus") {
      state.focusMin = minutes;
      updatePresetHighlight();
      render();
    }
  });

  function endDrag(e) {
    var wasDragging = draggedThisGesture;
    dragging = false;
    draggedThisGesture = false;
    if (!wasDragging) startPause();
  }

  ringWrap.addEventListener("pointerup", function (e) {
    e.preventDefault();
    endDrag(e);
  });
  ringWrap.addEventListener("pointercancel", function () {
    dragging = false;
    draggedThisGesture = false;
  });

  presetBtns.forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      state.focusMin = clampInt(btn.getAttribute("data-focus"), 1, MAX_FOCUS_MIN);
      state.restMin = clampInt(btn.getAttribute("data-rest"), 1, 60);
      restMinInput.value = state.restMin;
      if (!state.running) {
        var minutes = state.mode === "focus" ? state.focusMin : state.restMin;
        state.total = minutes * 60;
        state.remaining = state.total;
      }
      updatePresetHighlight();
      render();
    });
  });

  document.querySelectorAll(".stepper button[data-step]").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var step = parseInt(btn.getAttribute("data-step"), 10);
      state.restMin = clampInt(state.restMin + step, 1, 60);
      restMinInput.value = state.restMin;
      updatePresetHighlight();
      if (!state.running && state.mode === "rest") {
        state.total = state.restMin * 60;
        state.remaining = state.total;
        render();
      }
    });
  });

  restMinInput.addEventListener("change", function () {
    state.restMin = clampInt(restMinInput.value, 1, 60);
    restMinInput.value = state.restMin;
    updatePresetHighlight();
    if (!state.running && state.mode === "rest") {
      state.total = state.restMin * 60;
      state.remaining = state.total;
      render();
    }
  });

  restMinInput.addEventListener("click", function (e) { e.stopPropagation(); });
  soundSelect.addEventListener("click", function (e) { e.stopPropagation(); });

  var audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function noiseBurst(ctx, now, durationSec, filterType, filterFreq, peakGain, decaySec) {
    var bufferSize = Math.max(1, Math.floor(ctx.sampleRate * durationSec));
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var j = 0; j < bufferSize; j++) {
      data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / bufferSize, 2);
    }
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = filterFreq;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(peakGain, now);
    gain.gain.exponentialRampToValueAtTime(0.0005, now + decaySec);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(now);
    return noise;
  }

  function playClick(up) {
    try {
      var ctx = getCtx();
      var now = ctx.currentTime;
      var pitch = up ? 1 : 0.86;

      // soft "tock" body — a short damped tone, like a wooden bead or toy click
      var osc = ctx.createOscillator();
      var oscGain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(520 * pitch, now);
      osc.frequency.exponentialRampToValueAtTime(300 * pitch, now + 0.04);
      oscGain.gain.setValueAtTime(0, now);
      oscGain.gain.linearRampToValueAtTime(0.22, now + 0.004);
      oscGain.gain.exponentialRampToValueAtTime(0.0005, now + 0.05);
      osc.connect(oscGain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.06);

      // a touch of soft click texture, rounded rather than harsh
      noiseBurst(ctx, now, 0.006, "bandpass", 1800 * pitch, 0.16, 0.012);
    } catch (e) {}
  }

  function playMilestone() {
    try {
      var ctx = getCtx();
      var now = ctx.currentTime;

      // "しゃかっ" — a short ratchet/whirl texture: a few quick noise grains
      // plus a fast downward pitch sweep, distinct from the plain click.
      for (var i = 0; i < 4; i++) {
        noiseBurst(ctx, now + i * 0.018, 0.02, "bandpass", 2200 - i * 250, 0.22, 0.025);
      }

      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.09);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.15, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0005, now + 0.1);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.11);
    } catch (e) {}
  }

  function playTemple(toFocus) {
    var ctx = getCtx();
    var now = ctx.currentTime;
    var base = toFocus ? 146 : 130;
    var partials = [1, 2.01, 2.99, 4.2];
    var gains = [0.5, 0.22, 0.12, 0.06];
    partials.forEach(function (mult, i) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = base * mult;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(gains[i], now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0005, now + 3.2);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 3.3);
    });
  }

  function playChime(toFocus) {
    var ctx = getCtx();
    var now = ctx.currentTime;
    var notes = toFocus ? [880, 1318.5] : [1318.5, 880];
    notes.forEach(function (freq, i) {
      var start = now + i * 0.16;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.35, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0005, start + 1.1);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 1.2);
    });
  }

  function playBeep(toFocus) {
    var ctx = getCtx();
    var now = ctx.currentTime;
    var count = toFocus ? 3 : 2;
    var gap = toFocus ? 0.16 : 0.28;
    var freq = toFocus ? 1050 : 830;
    for (var i = 0; i < count; i++) {
      var start = now + i * gap;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.3, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0005, start + 0.18);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.2);
    }
  }

  function playMoktak(toFocus) {
    var ctx = getCtx();
    var now = ctx.currentTime;
    var hits = toFocus ? 2 : 1;
    for (var i = 0; i < hits; i++) {
      var start = now + i * 0.26;
      var bufferSize = ctx.sampleRate * 0.06;
      var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var j = 0; j < bufferSize; j++) {
        data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / bufferSize, 3);
      }
      var noise = ctx.createBufferSource();
      noise.buffer = buffer;
      var filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 700;
      filter.Q.value = 1.2;
      var gain = ctx.createGain();
      gain.gain.setValueAtTime(0.6, start);
      gain.gain.exponentialRampToValueAtTime(0.0005, start + 0.15);
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start(start);
    }
  }

  var SOUND_FN = { temple: playTemple, chime: playChime, beep: playBeep, moktak: playMoktak };

  function playBell(toFocus) {
    var fn = SOUND_FN[soundSelect.value] || playChime;
    try { fn(!!toFocus); } catch (e) {}
  }

  var previewToggle = true;
  previewBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    playBell(previewToggle);
    previewToggle = !previewToggle;
  });

  renderDailyStats();

  counterStepInput.value = counterState.step;
  renderCounter();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  updatePresetHighlight();
  render();
</script>
