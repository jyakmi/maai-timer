<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>間合い</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#93704b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="間合い">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f5f1e9;
    --surface: #fbf9f4;
    --surface-border: #e2dac8;
    --text: #2b2924;
    --text-muted: #8a8271;
    --wood: #93704b;
    --wood-soft: #ece1d0;
    --sage: #74886d;
    --sage-soft: #e2e8dd;
    --knob-ring: #fffdf9;
    --shadow: 0 1px 2px rgba(43, 41, 36, 0.05), 0 16px 40px rgba(43, 41, 36, 0.08);
    --knob-shadow: 0 2px 6px rgba(43, 41, 36, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a16;
      --surface: #242119;
      --surface-border: #38332a;
      --text: #ede8dd;
      --text-muted: #a89e8a;
      --wood: #c99f74;
      --wood-soft: #382d20;
      --sage: #9ab093;
      --sage-soft: #26302a;
      --knob-ring: #2b2721;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 20px 44px rgba(0, 0, 0, 0.4);
      --knob-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1c1a16;
    --surface: #242119;
    --surface-border: #38332a;
    --text: #ede8dd;
    --text-muted: #a89e8a;
    --wood: #c99f74;
    --wood-soft: #382d20;
    --sage: #9ab093;
    --sage-soft: #26302a;
    --knob-ring: #2b2721;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 20px 44px rgba(0, 0, 0, 0.4);
    --knob-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  button {
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .time-display, .counter-value {
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--body-bg, var(--bg));
    color: var(--text);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    transition: background 3s ease;
  }

  :root { --ring-size: 236px; }

  @media (max-width: 480px) {
    :root { --ring-size: min(70vw, 300px); }
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 34px 28px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    transition: border-color 0.4s ease;
  }

  .card[data-mode="focus"] { border-color: color-mix(in srgb, var(--wood) 35%, var(--surface-border)); }
  .card[data-mode="rest"]  { border-color: color-mix(in srgb, var(--sage) 35%, var(--surface-border)); }

  .tab-bar {
    display: flex;
    gap: 6px;
    background: var(--bg);
    border-radius: 999px;
    padding: 4px;
    border: 1px solid var(--surface-border);
  }

  .tab-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab-btn svg { width: 16px; height: 16px; }

  .tab-btn[data-active="true"] {
    background: var(--surface);
    color: var(--wood);
    box-shadow: 0 1px 3px rgba(43, 41, 36, 0.12);
  }

  .tab-btn:focus-visible { outline: 2px solid var(--wood); outline-offset: 2px; }

  .top-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--surface-border);
    background: var(--bg);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, color 0.15s ease, transform 0.08s ease;
  }

  .icon-btn:active { transform: scale(0.92); }
  .icon-btn:hover { color: var(--text); background: var(--wood-soft); }
  .icon-btn:focus-visible { outline: 2px solid var(--wood); outline-offset: 2px; }
  .icon-btn svg { width: 16px; height: 16px; }

  .mode-dot[hidden] { visibility: hidden; }

  .mode-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--wood);
    transition: background 0.4s ease;
  }

  .card[data-mode="rest"] .mode-dot { background: var(--sage); }

  .ring-wrap {
    position: relative;
    width: var(--ring-size);
    height: var(--ring-size);
    touch-action: none;
    cursor: pointer;
  }

  .ring-dial-svg { transform: rotate(-90deg); display: block; width: 100%; height: 100%; }

  .ring-track { fill: none; stroke: var(--surface-border); stroke-width: 10; }

  .ring-progress {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke 0.4s ease;
  }

  .ring-progress.animated { transition: stroke-dashoffset 0.3s linear, stroke 0.4s ease; }

  .ring-knob {
    fill: var(--knob-ring);
    stroke: var(--wood);
    stroke-width: 3;
    filter: drop-shadow(var(--knob-shadow));
  }

  .card[data-mode="rest"] .ring-knob { stroke: var(--sage); }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    pointer-events: none;
  }

  .time-display {
    font-size: 52px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    line-height: 1;
  }

  .transport-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--wood);
  }

  .transport-icon svg { width: 100%; height: 100%; }

  .card[data-mode="rest"] .transport-icon { color: var(--sage); }

  #timerView, #counterView {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    width: 100%;
  }

  #timerView[hidden], #counterView[hidden] {
    display: none;
  }

  .counter-circle {
    width: var(--ring-size);
    height: var(--ring-size);
    border-radius: 50%;
    border: 1px solid var(--surface-border);
    background: var(--bg);
    box-shadow: inset 0 0 0 10px var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: transform 0.08s ease, background 0.15s ease;
    font-family: inherit;
    touch-action: manipulation;
  }

  .counter-circle:active { transform: scale(0.98); }
  .counter-circle:hover { background: var(--wood-soft); }
  .counter-circle:focus-visible { outline: 2px solid var(--wood); outline-offset: 4px; }

  .counter-value {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--wood);
  }

  .counter-stage {
    position: relative;
  }

  .sparkle-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
  }

  .sparkle-particle {
    position: absolute;
    font-size: 22px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    animation: sparkle-float 0.8s ease-out forwards;
  }

  @keyframes sparkle-float {
    0% { opacity: 0; transform: translate(-50%, -50%) translate(var(--sx0, 0px), var(--sy0, 0px)) scale(0.6) rotate(0deg); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--sx1, 0px), var(--sy1, -70px)) scale(1.1) rotate(var(--srot, 20deg)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sparkle-particle { animation: none; opacity: 0; }
  }

  .counter-controls {
    display: flex;
    justify-content: center;
  }

  .counter-minus {
    width: 44px;
    height: 44px;
    font-size: 22px;
  }

  .break-hint {
    min-height: 28px;
    font-size: 13px;
    color: var(--sage);
    background: var(--sage-soft);
    padding: 6px 16px;
    border-radius: 999px;
    text-align: center;
  }

  .break-hint[hidden] { visibility: hidden; }

  .settings {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 18px;
    border-top: 1px dashed var(--surface-border);
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.25s ease, padding 0.3s ease, border-color 0.3s ease;
  }

  .settings[data-open="true"] {
    max-height: 320px;
    opacity: 1;
  }

  .settings[data-open="false"] {
    padding-top: 0;
    border-color: transparent;
  }

  .field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .field-label {
    font-size: 13px;
    color: var(--text-muted);
  }

  .field-label .hint {
    font-size: 11px;
    opacity: 0.75;
  }

  .presets-row { flex-direction: column; align-items: flex-start; gap: 10px; }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }

  button.chip {
    font-family: inherit;
    cursor: pointer;
    border-radius: 999px;
    border: 1px solid var(--surface-border);
    background: transparent;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 14px;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  button.chip:hover { background: var(--wood-soft); }

  button.chip[data-active="true"] {
    background: var(--wood-soft);
    border-color: var(--wood);
    color: var(--wood);
  }

  .stepper { display: flex; align-items: center; gap: 10px; }

  .stepper button {
    width: 26px;
    height: 26px;
    padding: 0;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1;
    border: 1px solid var(--surface-border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stepper button:hover { background: var(--wood-soft); }

  .stepper input {
    width: 42px;
    text-align: center;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    padding: 4px;
  }

  select {
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    padding: 6px 8px;
  }

  .sound-row { display: flex; align-items: center; gap: 8px; }

  .daily-stats {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 24px;
    flex-shrink: 0;
  }

  .switch input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }

  .switch-track {
    position: absolute;
    inset: 0;
    background: var(--surface-border);
    border-radius: 999px;
    transition: background 0.2s ease;
    pointer-events: none;
  }

  .switch-track::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--surface);
    transition: transform 0.2s ease;
  }

  .switch input:checked + .switch-track { background: var(--wood); }
  .switch input:checked + .switch-track::before { transform: translateX(16px); }
  .switch input:focus-visible + .switch-track { outline: 2px solid var(--wood); outline-offset: 2px; }

  .daylight-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 4px;
    padding-top: 12px;
    border-top: 1px dashed var(--surface-border);
  }

  .daylight-status {
    margin: 0;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .latlon-row {
    display: flex;
    gap: 6px;
  }

  .latlon-row input {
    width: 68px;
    text-align: center;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    padding: 5px 4px;
  }

  .screensaver[hidden] { display: none; }

  .screensaver {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: var(--body-bg, var(--bg));
    transition: background 3s ease;
    cursor: pointer;
    z-index: 100;
    overflow: hidden;
  }

  .sky-arc {
    position: absolute;
    left: 50%;
    top: 62%;
    width: 86vmin;
    height: 86vmin;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .sky-arc .body-dot {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 24px 6px currentColor;
  }

  .clock {
    position: relative;
    font-size: 15vmin;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
  }

  .screensaver-hint {
    position: relative;
    margin: 0;
    font-size: 13px;
    color: var(--text-muted);
    opacity: 0.7;
  }

  @media (prefers-reduced-motion: reduce) {
    body, .screensaver { transition: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring-progress, .settings { transition: none; }
  }
</style>

<div class="card" id="card" data-mode="focus">
  <div class="tab-bar">
    <button class="tab-btn" id="tabTimer" data-active="true" aria-label="タイマー" title="タイマー">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path><path d="M9 2h6"></path></svg>
    </button>
    <button class="tab-btn" id="tabCounter" data-active="false" aria-label="カウンター" title="カウンター">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
    </button>
  </div>

  <div class="top-row">
    <button class="icon-btn reset-btn" id="resetBtn" aria-label="リセット" title="リセット">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
    </button>
    <span class="mode-dot" id="modeDot"></span>
    <button class="icon-btn settings-btn" id="settingsBtn" aria-label="設定" title="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <div id="timerView">
    <div class="ring-wrap" id="ringWrap">
      <svg class="ring-dial-svg" width="236" height="236" viewBox="0 0 236 236">
        <circle class="ring-track" cx="118" cy="118" r="102"></circle>
        <circle class="ring-progress" id="ringProgress" cx="118" cy="118" r="102"></circle>
        <circle class="ring-knob" id="ringKnob" cx="118" cy="16" r="9"></circle>
      </svg>
      <div class="ring-center">
        <div class="time-display" id="timeDisplay">25</div>
        <div class="transport-icon" id="playIcon"></div>
      </div>
    </div>

    <p class="break-hint" id="breakHint" hidden></p>

    <div class="settings" id="settings" data-open="false">
      <div class="field-row presets-row">
        <span class="field-label">プリセット</span>
        <div class="presets">
          <button class="chip" data-focus="90" data-rest="20">深い集中 90/20</button>
          <button class="chip" data-focus="25" data-rest="5">浅い集中 25/5</button>
          <button class="chip" data-focus="52" data-rest="17">52/17</button>
        </div>
      </div>
      <div class="field-row">
        <span class="field-label">休憩時間（分）</span>
        <div class="stepper">
          <button data-step="-1" data-target="restMin" aria-label="休憩時間を減らす">−</button>
          <input type="number" id="restMin" value="5" min="1" max="60" inputmode="numeric">
          <button data-step="1" data-target="restMin" aria-label="休憩時間を増やす">＋</button>
        </div>
      </div>
      <div class="field-row">
        <span class="field-label">ベル音</span>
        <div class="sound-row">
          <select id="soundSelect">
            <option value="temple">鐘（低く長い余韻）</option>
            <option value="chime" selected>チャイム（澄んだ音）</option>
            <option value="beep">シンプルビープ</option>
            <option value="moktak">木魚（乾いた音）</option>
          </select>
          <button class="chip" id="previewBtn">試聴</button>
        </div>
      </div>
      <p class="daily-stats" id="dailyStats">今日: 0回 ／ 0分</p>

      <div class="field-row">
        <span class="field-label">日照モード<span class="hint">（実験的）</span></span>
        <label class="switch">
          <input type="checkbox" id="daylightToggle">
          <span class="switch-track"></span>
        </label>
      </div>
      <div class="daylight-panel" id="daylightPanel" hidden>
        <p class="daylight-status" id="daylightStatus">位置情報を確認中…</p>
        <div class="field-row">
          <span class="field-label">緯度・経度（手動調整）</span>
          <div class="latlon-row">
            <input type="number" id="latInput" step="0.01" inputmode="decimal">
            <input type="number" id="lonInput" step="0.01" inputmode="decimal">
          </div>
        </div>
        <button class="chip" id="screensaverBtn">全体表示（スクリーンセーバー）</button>
      </div>
    </div>
  </div>

  <div id="counterView" hidden>
    <div class="counter-stage">
      <button class="counter-circle" id="counterCircle" aria-label="カウントを増やす" title="タップで+1">
        <span class="counter-value" id="counterValue">0</span>
      </button>
      <div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>
    </div>

    <div class="counter-controls">
      <button class="icon-btn counter-minus" id="counterMinus" aria-label="1減らす" title="1減らす">−</button>
    </div>

    <div class="settings" id="counterSettings" data-open="false">
      <div class="field-row">
        <span class="field-label">増減幅</span>
        <div class="stepper">
          <button data-step="-1" data-target="counterStep" aria-label="増減幅を減らす">−</button>
          <input type="number" id="counterStep" value="1" min="1" max="1000" inputmode="numeric">
          <button data-step="1" data-target="counterStep" aria-label="増減幅を増やす">＋</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="screensaver" id="screensaver" hidden>
  <div class="sky-arc" id="skyArc"></div>
  <div class="clock" id="screensaverClock">--:--</div>
  <p class="screensaver-hint">タップで戻る</p>
</div>

<script>
  var R = 102;
  var CIRC = 2 * Math.PI * R;
  var MAX_FOCUS_MIN = 90;

  var card = document.getElementById("card");
  var modeDot = document.getElementById("modeDot");
  var ringWrap = document.getElementById("ringWrap");
  var ringProgress = document.getElementById("ringProgress");
  var ringKnob = document.getElementById("ringKnob");
  var timeDisplay = document.getElementById("timeDisplay");
  var playIcon = document.getElementById("playIcon");
  var resetBtn = document.getElementById("resetBtn");
  var settingsBtn = document.getElementById("settingsBtn");
  var settingsPanel = document.getElementById("settings");
  var restMinInput = document.getElementById("restMin");
  var soundSelect = document.getElementById("soundSelect");
  var previewBtn = document.getElementById("previewBtn");
  var breakHint = document.getElementById("breakHint");
  var presetBtns = document.querySelectorAll(".chip[data-focus]");
  var dailyStatsEl = document.getElementById("dailyStats");
  var tabTimer = document.getElementById("tabTimer");
  var tabCounter = document.getElementById("tabCounter");
  var timerView = document.getElementById("timerView");
  var counterView = document.getElementById("counterView");
  var counterCircle = document.getElementById("counterCircle");
  var counterValue = document.getElementById("counterValue");
  var sparkleLayer = document.getElementById("sparkleLayer");
  var counterMinus = document.getElementById("counterMinus");
  var counterSettings = document.getElementById("counterSettings");
  var counterStepInput = document.getElementById("counterStep");
  var daylightToggle = document.getElementById("daylightToggle");
  var daylightPanel = document.getElementById("daylightPanel");
  var daylightStatus = document.getElementById("daylightStatus");
  var latInput = document.getElementById("latInput");
  var lonInput = document.getElementById("lonInput");
  var screensaverBtn = document.getElementById("screensaverBtn");
  var screensaverEl = document.getElementById("screensaver");
  var skyArc = document.getElementById("skyArc");
  var screensaverClock = document.getElementById("screensaverClock");

  ringProgress.style.strokeDasharray = CIRC;

  var BREAK_MESSAGES = [
    "画面から離れて、遠くを見る",
    "立ち上がって、伸びをする",
    "窓の外を見る",
    "水を一口飲む",
    "肩と首をゆっくり回す",
    "深呼吸を3回する"
  ];

  var MODE_COLOR = { focus: "#93704b", rest: "#74886d" };

  var state = {
    mode: "focus",
    running: false,
    focusMin: 25,
    restMin: 5,
    remaining: 25 * 60,
    total: 25 * 60,
    tickId: null,
    endAt: 0,
    hintText: "",
    focusCycles: 0,
    isLongBreak: false,
    started: false
  };

  var activeTab = "timer";

  var counterState = { count: 0, step: 1 };

  function loadCounter() {
    try {
      var saved = JSON.parse(localStorage.getItem("maai-counter") || "null");
      if (saved && typeof saved.count === "number") counterState.count = saved.count;
      if (saved && typeof saved.step === "number") counterState.step = saved.step;
    } catch (e) {}
  }

  function saveCounter() {
    try {
      localStorage.setItem("maai-counter", JSON.stringify(counterState));
    } catch (e) {}
  }

  function clampInt(v, min, max) {
    v = parseInt(v, 10);
    if (isNaN(v)) v = min;
    return Math.max(min, Math.min(max, v));
  }

  function setArc(fraction, animated) {
    fraction = Math.max(0, Math.min(1, fraction));
    ringProgress.classList.toggle("animated", !!animated);
    ringProgress.style.strokeDashoffset = CIRC * (1 - fraction);
    var angle = fraction * 2 * Math.PI;
    var cx = 118 + Math.cos(angle) * R;
    var cy = 118 + Math.sin(angle) * R;
    ringKnob.setAttribute("cx", cx);
    ringKnob.setAttribute("cy", cy);
  }

  function formatClock(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }

  function updatePresetHighlight() {
    presetBtns.forEach(function (btn) {
      var match = parseInt(btn.getAttribute("data-focus"), 10) === state.focusMin &&
        parseInt(btn.getAttribute("data-rest"), 10) === state.restMin;
      btn.setAttribute("data-active", match ? "true" : "false");
    });
  }

  function render() {
    ringProgress.setAttribute("stroke", MODE_COLOR[state.mode]);

    if (state.started) {
      timeDisplay.textContent = formatClock(state.remaining);
      setArc(state.total > 0 ? state.remaining / state.total : 0, state.running);
    } else {
      timeDisplay.textContent = String(state.mode === "focus" ? state.focusMin : state.restMin);
      var frac = state.mode === "focus" ? state.focusMin / MAX_FOCUS_MIN : state.restMin / 60;
      setArc(frac, false);
    }

    playIcon.innerHTML = state.running
      ? '<svg viewBox="0 0 32 32"><rect x="8" y="6" width="6" height="20" rx="2.5" fill="currentColor"/><rect x="18" y="6" width="6" height="20" rx="2.5" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 32 32"><path d="M9 6 L25 16 L9 26 Z" fill="currentColor" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';

    card.setAttribute("data-mode", state.mode);

    if (state.running && state.mode === "rest") {
      breakHint.textContent = state.hintText || "";
      breakHint.hidden = false;
    } else {
      breakHint.hidden = true;
    }
  }

  function tick() {
    var msLeft = state.endAt - Date.now();
    var secLeft = Math.max(0, Math.ceil(msLeft / 1000));
    if (secLeft <= 0) {
      state.remaining = 0;
      render();
      var toFocus = state.mode === "rest";
      playBell(toFocus);
      switchMode();
      if (state.running) state.endAt = Date.now() + state.remaining * 1000;
      return;
    }
    if (secLeft !== state.remaining) {
      state.remaining = secLeft;
      render();
    }
  }

  var LONG_BREAK_EVERY = 4;

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function loadDailyStats() {
    try {
      var saved = JSON.parse(localStorage.getItem("maai-daily-stats") || "null");
      if (saved && saved.date === todayKey()) return saved;
    } catch (e) {}
    return { date: todayKey(), count: 0, minutes: 0 };
  }

  function recordCompletedFocus(minutes) {
    var stats = loadDailyStats();
    stats.count += 1;
    stats.minutes += minutes;
    try { localStorage.setItem("maai-daily-stats", JSON.stringify(stats)); } catch (e) {}
    renderDailyStats(stats);
  }

  function renderDailyStats(stats) {
    stats = stats || loadDailyStats();
    if (dailyStatsEl) {
      dailyStatsEl.textContent = "今日: " + stats.count + "回 ／ " + stats.minutes + "分";
    }
  }

  function switchMode() {
    var completedFocusMinutes = state.mode === "focus" ? state.focusMin : null;
    state.mode = state.mode === "focus" ? "rest" : "focus";

    if (state.mode === "rest") {
      if (completedFocusMinutes !== null) recordCompletedFocus(completedFocusMinutes);
      state.focusCycles += 1;
      state.isLongBreak = state.focusCycles % LONG_BREAK_EVERY === 0;
      var restLen = state.isLongBreak ? Math.min(60, state.restMin * 3) : state.restMin;
      state.total = restLen * 60;
      state.hintText = (state.isLongBreak ? "長めの休憩。" : "") + BREAK_MESSAGES[Math.floor(Math.random() * BREAK_MESSAGES.length)];
    } else {
      state.isLongBreak = false;
      state.total = state.focusMin * 60;
    }
    state.remaining = state.total;
    render();
  }

  function startPause() {
    if (state.running) {
      state.running = false;
      clearInterval(state.tickId);
      render();
      return;
    }
    if (!state.started) {
      var minutes = state.mode === "focus" ? state.focusMin : state.restMin;
      state.total = minutes * 60;
      state.remaining = state.total;
    }
    state.started = true;
    state.running = true;
    state.endAt = Date.now() + state.remaining * 1000;
    state.tickId = setInterval(tick, 250);
    render();
  }

  function reset() {
    state.running = false;
    state.started = false;
    clearInterval(state.tickId);
    state.mode = "focus";
    state.focusCycles = 0;
    state.isLongBreak = false;
    state.total = state.focusMin * 60;
    state.remaining = state.total;
    render();
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && state.running) tick();
  });

  resetBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (activeTab === "counter") {
      if (counterState.count === 0) return;
      if (!confirm("カウンターを0に戻します。よろしいですか？")) return;
      counterState.count = 0;
      saveCounter();
      renderCounter();
    } else {
      if (!state.started) return;
      if (!confirm("タイマーをリセットします。進行中の時間は失われます。よろしいですか？")) return;
      reset();
    }
  });

  settingsBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    var panel = activeTab === "counter" ? counterSettings : settingsPanel;
    var open = panel.getAttribute("data-open") === "true";
    panel.setAttribute("data-open", open ? "false" : "true");
  });

  // --- Tab switching ---
  function setActiveTab(tab) {
    activeTab = tab;
    tabTimer.setAttribute("data-active", tab === "timer" ? "true" : "false");
    tabCounter.setAttribute("data-active", tab === "counter" ? "true" : "false");
    timerView.hidden = tab !== "timer";
    counterView.hidden = tab !== "counter";
    modeDot.hidden = tab !== "timer";
    settingsPanel.setAttribute("data-open", "false");
    counterSettings.setAttribute("data-open", "false");
    if (tab === "counter") renderCounter();
  }

  tabTimer.addEventListener("click", function () { setActiveTab("timer"); });
  tabCounter.addEventListener("click", function () { setActiveTab("counter"); });

  // --- Counter ---
  function renderCounter() {
    counterValue.textContent = String(counterState.count);
  }

  var SPARKLE_ICONS = ["✨", "⭐", "🌸", "🍀", "💫", "🎯", "🔥", "⚡"];

  function spawnSparkle() {
    if (!sparkleLayer) return;
    var el = document.createElement("span");
    el.className = "sparkle-particle";
    el.textContent = SPARKLE_ICONS[Math.floor(Math.random() * SPARKLE_ICONS.length)];
    var angle = Math.random() * Math.PI * 2;
    var dist = 30 + Math.random() * 20;
    el.style.setProperty("--sx0", "0px");
    el.style.setProperty("--sy0", "0px");
    el.style.setProperty("--sx1", (Math.cos(angle) * dist) + "px");
    el.style.setProperty("--sy1", (Math.sin(angle) * dist - 60) + "px");
    el.style.setProperty("--srot", (Math.random() * 40 - 20) + "deg");
    sparkleLayer.appendChild(el);
    setTimeout(function () { el.remove(); }, 850);
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  function counterIncrement() {
    counterState.count += counterState.step;
    saveCounter();
    renderCounter();
    spawnSparkle();
    vibrate(10);
    if (counterState.count !== 0 && counterState.count % 10 === 0) {
      playMilestone();
    } else {
      playClick(true);
    }
  }

  function counterDecrement() {
    counterState.count -= counterState.step;
    saveCounter();
    renderCounter();
    vibrate(10);
    if (counterState.count !== 0 && counterState.count % 10 === 0) {
      playMilestone();
    } else {
      playClick(false);
    }
  }

  counterCircle.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    counterIncrement();
  });
  counterMinus.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    counterDecrement();
  });

  counterStepInput.addEventListener("change", function () {
    counterState.step = clampInt(counterStepInput.value, 1, 1000);
    counterStepInput.value = counterState.step;
    saveCounter();
  });

  document.querySelectorAll('.stepper button[data-target="counterStep"]').forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var step = parseInt(btn.getAttribute("data-step"), 10);
      counterState.step = clampInt(counterState.step + step, 1, 1000);
      counterStepInput.value = counterState.step;
      saveCounter();
    });
  });

  counterStepInput.addEventListener("click", function (e) { e.stopPropagation(); });

  document.addEventListener("keydown", function (e) {
    if (activeTab !== "counter") return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowUp" || e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      counterIncrement();
    } else if (e.key === "ArrowDown" || e.key === "Backspace") {
      e.preventDefault();
      counterDecrement();
    }
  });

  loadCounter();

  // --- Drag-to-set (focus dial), physical-timer style ---
  var dragging = false;
  var draggedThisGesture = false;

  function angleToMinutes(clientX, clientY) {
    var rect = ringWrap.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = clientX - cx;
    var dy = clientY - cy;
    var angle = Math.atan2(dy, dx) + Math.PI / 2;
    if (angle < 0) angle += 2 * Math.PI;
    var fraction = angle / (2 * Math.PI);
    return clampInt(Math.round(fraction * MAX_FOCUS_MIN), 1, MAX_FOCUS_MIN);
  }

  ringWrap.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    draggedThisGesture = false;
    dragging = !state.started;
    ringWrap.setPointerCapture(e.pointerId);
  });

  ringWrap.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    draggedThisGesture = true;
    var minutes = angleToMinutes(e.clientX, e.clientY);
    if (state.mode === "focus") {
      state.focusMin = minutes;
      updatePresetHighlight();
      render();
    }
  });

  function endDrag(e) {
    var wasDragging = draggedThisGesture;
    dragging = false;
    draggedThisGesture = false;
    if (!wasDragging) startPause();
  }

  ringWrap.addEventListener("pointerup", function (e) {
    e.preventDefault();
    endDrag(e);
  });
  ringWrap.addEventListener("pointercancel", function () {
    dragging = false;
    draggedThisGesture = false;
  });

  presetBtns.forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      state.focusMin = clampInt(btn.getAttribute("data-focus"), 1, MAX_FOCUS_MIN);
      state.restMin = clampInt(btn.getAttribute("data-rest"), 1, 60);
      restMinInput.value = state.restMin;
      if (!state.running) {
        var minutes = state.mode === "focus" ? state.focusMin : state.restMin;
        state.total = minutes * 60;
        state.remaining = state.total;
      }
      updatePresetHighlight();
      render();
    });
  });

  document.querySelectorAll(".stepper button[data-step]").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var step = parseInt(btn.getAttribute("data-step"), 10);
      state.restMin = clampInt(state.restMin + step, 1, 60);
      restMinInput.value = state.restMin;
      updatePresetHighlight();
      if (!state.running && state.mode === "rest") {
        state.total = state.restMin * 60;
        state.remaining = state.total;
        render();
      }
    });
  });

  restMinInput.addEventListener("change", function () {
    state.restMin = clampInt(restMinInput.value, 1, 60);
    restMinInput.value = state.restMin;
    updatePresetHighlight();
    if (!state.running && state.mode === "rest") {
      state.total = state.restMin * 60;
      state.remaining = state.total;
      render();
    }
  });

  restMinInput.addEventListener("click", function (e) { e.stopPropagation(); });
  soundSelect.addEventListener("click", function (e) { e.stopPropagation(); });

  var audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function noiseBurst(ctx, now, durationSec, filterType, filterFreq, peakGain, decaySec) {
    var bufferSize = Math.max(1, Math.floor(ctx.sampleRate * durationSec));
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var j = 0; j < bufferSize; j++) {
      data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / bufferSize, 2);
    }
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = filterFreq;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(peakGain, now);
    gain.gain.exponentialRampToValueAtTime(0.0005, now + decaySec);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(now);
    return noise;
  }

  function playClick(up) {
    try {
      var ctx = getCtx();
      var now = ctx.currentTime;
      var pitch = up ? 1 : 0.86;

      // sharp mechanical "kachi" — a real click, not a soft tone
      noiseBurst(ctx, now, 0.008, "bandpass", 3600 * pitch, 0.4, 0.012);
      noiseBurst(ctx, now, 0.004, "highpass", 5000, 0.15, 0.006);

      // a beat later, the ratchet/pawl catching — smaller, lower
      noiseBurst(ctx, now + 0.012, 0.007, "bandpass", 1900 * pitch, 0.22, 0.012);
    } catch (e) {}
  }

  function playMilestone() {
    try {
      var ctx = getCtx();
      var now = ctx.currentTime;

      // "カッチ" — the heavier snap of a mechanical counter's reset lever:
      // one firm, low, resonant click, not a multi-grain ratchet.
      noiseBurst(ctx, now, 0.014, "bandpass", 1400, 0.55, 0.03);
      noiseBurst(ctx, now, 0.006, "highpass", 3200, 0.2, 0.012);

      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.05);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0005, now + 0.07);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } catch (e) {}
  }

  function playTemple(toFocus) {
    var ctx = getCtx();
    var now = ctx.currentTime;
    var base = toFocus ? 146 : 130;
    var partials = [1, 2.01, 2.99, 4.2];
    var gains = [0.5, 0.22, 0.12, 0.06];
    partials.forEach(function (mult, i) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = base * mult;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(gains[i], now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0005, now + 3.2);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 3.3);
    });
  }

  function playChime(toFocus) {
    var ctx = getCtx();
    var now = ctx.currentTime;
    var notes = toFocus ? [880, 1318.5] : [1318.5, 880];
    notes.forEach(function (freq, i) {
      var start = now + i * 0.16;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.35, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0005, start + 1.1);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 1.2);
    });
  }

  function playBeep(toFocus) {
    var ctx = getCtx();
    var now = ctx.currentTime;
    var count = toFocus ? 3 : 2;
    var gap = toFocus ? 0.16 : 0.28;
    var freq = toFocus ? 1050 : 830;
    for (var i = 0; i < count; i++) {
      var start = now + i * gap;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.3, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0005, start + 0.18);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.2);
    }
  }

  function playMoktak(toFocus) {
    var ctx = getCtx();
    var now = ctx.currentTime;
    var hits = toFocus ? 2 : 1;
    for (var i = 0; i < hits; i++) {
      var start = now + i * 0.26;
      var bufferSize = ctx.sampleRate * 0.06;
      var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var j = 0; j < bufferSize; j++) {
        data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / bufferSize, 3);
      }
      var noise = ctx.createBufferSource();
      noise.buffer = buffer;
      var filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 700;
      filter.Q.value = 1.2;
      var gain = ctx.createGain();
      gain.gain.setValueAtTime(0.6, start);
      gain.gain.exponentialRampToValueAtTime(0.0005, start + 0.15);
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start(start);
    }
  }

  var SOUND_FN = { temple: playTemple, chime: playChime, beep: playBeep, moktak: playMoktak };

  function playBell(toFocus) {
    var fn = SOUND_FN[soundSelect.value] || playChime;
    try { fn(!!toFocus); } catch (e) {}
  }

  var previewToggle = true;
  previewBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    playBell(previewToggle);
    previewToggle = !previewToggle;
  });

  renderDailyStats();

  // ==================== 日照モード ====================

  var DAYLIGHT_RAD = Math.PI / 180;
  var J1970 = 2440588, J2000 = 2451545, DAY_MS = 86400000;
  var EARTH_OBLIQUITY = DAYLIGHT_RAD * 23.4397;

  function toJulian(date) { return date.valueOf() / DAY_MS - 0.5 + J1970; }
  function fromJulian(j) { return new Date((j + 0.5 - J1970) * DAY_MS); }
  function toDays(date) { return toJulian(date) - J2000; }
  function solarMeanAnomaly(d) { return DAYLIGHT_RAD * (357.5291 + 0.98560028 * d); }
  function eclipticLongitude(M) {
    var C = DAYLIGHT_RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    var P = DAYLIGHT_RAD * 102.9372;
    return M + C + P + Math.PI;
  }
  function declination(l) { return Math.asin(Math.sin(0) * Math.cos(EARTH_OBLIQUITY) + Math.cos(0) * Math.sin(EARTH_OBLIQUITY) * Math.sin(l)); }
  function julianCycle(d, lw) { return Math.round(d - 0.0009 - lw / (2 * Math.PI)); }
  function approxTransit(Ht, lw, n) { return 0.0009 + (Ht + lw) / (2 * Math.PI) + n; }
  function solarTransitJ(ds, M, L) { return J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L); }
  function hourAngle(h, phi, d) {
    var cosH = (Math.sin(h) - Math.sin(phi) * Math.sin(d)) / (Math.cos(phi) * Math.cos(d));
    return Math.acos(Math.max(-1, Math.min(1, cosH)));
  }

  function getSunTimes(date, lat, lon) {
    var lw = DAYLIGHT_RAD * -lon, phi = DAYLIGHT_RAD * lat, d = toDays(date);
    var n = julianCycle(d, lw), ds = approxTransit(0, lw, n);
    var M = solarMeanAnomaly(ds), L = eclipticLongitude(M);
    var dec = declination(L);
    var Jnoon = solarTransitJ(ds, M, L);
    var h0 = DAYLIGHT_RAD * -0.833;
    var w = hourAngle(h0, phi, dec);
    var a = approxTransit(w, lw, n);
    var Jset = solarTransitJ(a, M, L);
    var Jrise = Jnoon - (Jset - Jnoon);
    return { sunrise: fromJulian(Jrise), sunset: fromJulian(Jset), solarNoon: fromJulian(Jnoon) };
  }

  // rough per-timezone reference point (no external calls; used only as a fallback)
  var TZ_LOCATIONS = {
    "Asia/Seoul": [37.57, 126.98], "Asia/Tokyo": [35.68, 139.69],
    "Asia/Shanghai": [31.23, 121.47], "Asia/Hong_Kong": [22.32, 114.17],
    "Asia/Taipei": [25.03, 121.57], "Asia/Singapore": [1.35, 103.82],
    "Asia/Kolkata": [28.61, 77.21], "Asia/Bangkok": [13.76, 100.5],
    "Asia/Dubai": [25.2, 55.27], "Europe/London": [51.51, -0.13],
    "Europe/Paris": [48.86, 2.35], "Europe/Berlin": [52.52, 13.4],
    "Europe/Moscow": [55.76, 37.62], "America/New_York": [40.71, -74.01],
    "America/Chicago": [41.88, -87.63], "America/Denver": [39.74, -104.99],
    "America/Los_Angeles": [34.05, -118.24], "America/Sao_Paulo": [-23.55, -46.63],
    "Australia/Sydney": [-33.87, 151.21], "Pacific/Auckland": [-36.85, 174.76]
  };

  var daylightState = { lat: null, lon: null, source: "", intervalId: null, screensaverIntervalId: null };

  function loadDaylightPrefs() {
    try {
      var saved = JSON.parse(localStorage.getItem("maai-daylight") || "null");
      return saved || {};
    } catch (e) { return {}; }
  }

  function saveDaylightPrefs(patch) {
    try {
      var current = loadDaylightPrefs();
      localStorage.setItem("maai-daylight", JSON.stringify(Object.assign(current, patch)));
    } catch (e) {}
  }

  function resolveLocation(callback) {
    var saved = loadDaylightPrefs();
    if (typeof saved.lat === "number" && typeof saved.lon === "number" && saved.manual) {
      callback(saved.lat, saved.lon, "手動入力");
      return;
    }
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          callback(pos.coords.latitude, pos.coords.longitude, "現在地");
        },
        function () { resolveByTimezone(callback); },
        { timeout: 6000, maximumAge: 3600000 }
      );
    } else {
      resolveByTimezone(callback);
    }
  }

  function resolveByTimezone(callback) {
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    if (TZ_LOCATIONS[tz]) {
      callback(TZ_LOCATIONS[tz][0], TZ_LOCATIONS[tz][1], "タイムゾーンから推定（" + tz + "）");
      return;
    }
    var offsetHours = -new Date().getTimezoneOffset() / 60;
    var lon = Math.max(-180, Math.min(180, offsetHours * 15));
    callback(35, lon, "PCの時刻設定からおおまかに推定");
  }

  function mixColor(c1, c2, t) {
    var r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
    var g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
    var b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  var SKY_NIGHT = [26, 28, 38];
  var SKY_DAWN = [247, 202, 178];
  var SKY_DAY = [245, 241, 233];
  var SKY_DUSK = [232, 170, 140];

  function computeSky(now, lat, lon) {
    var sun = getSunTimes(now, lat, lon);
    var yesterday = new Date(now.getTime() - DAY_MS);
    var tomorrow = new Date(now.getTime() + DAY_MS);
    var sunPrev = getSunTimes(yesterday, lat, lon);
    var sunNext = getSunTimes(tomorrow, lat, lon);

    var t = now.getTime();
    var twilight = 40 * 60 * 1000;
    var sunrise = sun.sunrise.getTime(), sunset = sun.sunset.getTime();
    var prevSunset = sunPrev.sunset.getTime(), nextSunrise = sunNext.sunrise.getTime();

    var color, frac, phase, isDaytime;

    if (t >= sunrise - twilight && t < sunrise + twilight) {
      frac = (t - (sunrise - twilight)) / (twilight * 2);
      color = mixColor(SKY_NIGHT, SKY_DAWN, Math.min(1, frac));
      if (frac > 0.5) color = mixColor(SKY_DAWN, SKY_DAY, (frac - 0.5) * 2);
      phase = "dawn"; isDaytime = frac > 0.5;
    } else if (t >= sunrise + twilight && t < sunset - twilight) {
      color = mixColor(SKY_DAY, SKY_DAY, 0);
      phase = "day"; isDaytime = true;
    } else if (t >= sunset - twilight && t < sunset + twilight) {
      frac = (t - (sunset - twilight)) / (twilight * 2);
      color = mixColor(SKY_DAY, SKY_DUSK, Math.min(1, frac));
      if (frac > 0.5) color = mixColor(SKY_DUSK, SKY_NIGHT, (frac - 0.5) * 2);
      phase = "dusk"; isDaytime = frac < 0.5;
    } else {
      color = mixColor(SKY_NIGHT, SKY_NIGHT, 0);
      phase = "night"; isDaytime = false;
    }

    // sun/moon arc progress 0..1 across the current daytime/nighttime span
    var arcFrac;
    if (isDaytime) {
      arcFrac = (t - sunrise) / Math.max(1, sunset - sunrise);
    } else if (t < sunrise) {
      arcFrac = (t - prevSunset) / Math.max(1, sunrise - prevSunset);
    } else {
      arcFrac = (t - sunset) / Math.max(1, nextSunrise - sunset);
    }
    arcFrac = Math.max(0, Math.min(1, arcFrac));

    return { color: color, phase: phase, isDaytime: isDaytime, arcFrac: arcFrac, sun: sun };
  }

  function applyDaylight() {
    if (daylightState.lat === null) return;
    var sky = computeSky(new Date(), daylightState.lat, daylightState.lon);
    document.documentElement.style.setProperty("--body-bg", sky.color);
    var phaseLabel = { dawn: "朝焼け", day: "昼", dusk: "夕焼け", night: "夜" }[sky.phase];
    daylightStatus.textContent = daylightState.source + " ／ 今: " + phaseLabel +
      "（日の出 " + formatClock2(sky.sun.sunrise) + " ・ 日の入り " + formatClock2(sky.sun.sunset) + "）";
    renderScreensaver(sky);
  }

  function formatClock2(d) {
    var h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m);
  }

  function renderScreensaver(sky) {
    if (screensaverEl.hidden) return;
    var angle = Math.PI - sky.arcFrac * Math.PI; // right-to-left arc, high at midpoint
    var cx = 50 + Math.cos(angle) * 42;
    var cy = 50 - Math.sin(angle) * 42;
    var dot = skyArc.querySelector(".body-dot");
    if (!dot) {
      dot = document.createElement("div");
      dot.className = "body-dot";
      skyArc.appendChild(dot);
    }
    dot.style.left = cx + "%";
    dot.style.top = cy + "%";
    dot.style.color = sky.isDaytime ? "#e8b26a" : "#c9d3e8";
    dot.style.background = sky.isDaytime ? "#f4c67a" : "#dbe3f2";
    screensaverClock.textContent = formatClock2(new Date());
  }

  function startDaylightLoop() {
    stopDaylightLoop();
    applyDaylight();
    daylightState.intervalId = setInterval(applyDaylight, 60000);
  }

  function stopDaylightLoop() {
    if (daylightState.intervalId) clearInterval(daylightState.intervalId);
    daylightState.intervalId = null;
  }

  function enableDaylight() {
    var prefs = loadDaylightPrefs();
    if (typeof prefs.lat === "number" && typeof prefs.lon === "number") {
      daylightState.lat = prefs.lat;
      daylightState.lon = prefs.lon;
      daylightState.source = prefs.manual ? "手動入力" : (prefs.source || "保存済みの位置");
      latInput.value = prefs.lat;
      lonInput.value = prefs.lon;
      startDaylightLoop();
    }
    daylightStatus.textContent = "位置情報を確認中…";
    resolveLocation(function (lat, lon, source) {
      daylightState.lat = lat;
      daylightState.lon = lon;
      daylightState.source = source;
      latInput.value = Math.round(lat * 100) / 100;
      lonInput.value = Math.round(lon * 100) / 100;
      saveDaylightPrefs({ lat: lat, lon: lon, source: source, manual: source === "手動入力" });
      startDaylightLoop();
    });
  }

  function disableDaylight() {
    stopDaylightLoop();
    document.documentElement.style.removeProperty("--body-bg");
  }

  daylightToggle.addEventListener("change", function () {
    daylightPanel.hidden = !daylightToggle.checked;
    if (daylightToggle.checked) {
      enableDaylight();
    } else {
      disableDaylight();
      closeScreensaver();
    }
  });

  function applyManualLocation() {
    var lat = parseFloat(latInput.value);
    var lon = parseFloat(lonInput.value);
    if (isNaN(lat) || isNaN(lon)) return;
    daylightState.lat = lat;
    daylightState.lon = lon;
    daylightState.source = "手動入力";
    saveDaylightPrefs({ lat: lat, lon: lon, source: "手動入力", manual: true });
    applyDaylight();
  }

  latInput.addEventListener("change", applyManualLocation);
  lonInput.addEventListener("change", applyManualLocation);
  latInput.addEventListener("click", function (e) { e.stopPropagation(); });
  lonInput.addEventListener("click", function (e) { e.stopPropagation(); });

  function openScreensaver() {
    if (daylightState.lat === null) return;
    screensaverEl.hidden = false;
    applyDaylight();
    daylightState.screensaverIntervalId = setInterval(applyDaylight, 1000);
  }

  function closeScreensaver() {
    screensaverEl.hidden = true;
    if (daylightState.screensaverIntervalId) clearInterval(daylightState.screensaverIntervalId);
    daylightState.screensaverIntervalId = null;
  }

  screensaverBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    openScreensaver();
  });
  screensaverEl.addEventListener("click", closeScreensaver);

  // restore saved daylight preference on load
  (function initDaylight() {
    var prefs = loadDaylightPrefs();
    if (prefs.enabled) {
      daylightToggle.checked = true;
      daylightPanel.hidden = false;
      enableDaylight();
    }
  })();

  daylightToggle.addEventListener("change", function () {
    saveDaylightPrefs({ enabled: daylightToggle.checked });
  });

  counterStepInput.value = counterState.step;
  renderCounter();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  updatePresetHighlight();
  render();
</script>
